<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导出 PDF</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>网页导出 PDF</h1>
      <p class="subtitle">保持文字可复制</p>
    </header>

    <main>
      <section class="mode-section">
        <div class="switch-option">
          <span class="radio-label">
            <strong>提取正文 (阅读模式)</strong>
            <small>使用 Readability 优化排版，移除干扰内容</small>
          </span>
          <label class="switch">
            <input type="checkbox" id="extractContent">
            <span class="slider round"></span>
          </label>
        </div>
      </section>

      <section class="options-section">
        <label class="section-label">导出格式</label>
        <div class="mode-options">
          <label class="radio-option">
            <input type="radio" name="exportFormat" value="vector" checked>
            <span class="radio-custom"></span>
            <span class="radio-label">
              <strong>矢量 PDF（推荐）</strong>
              <small>文字可复制，文件小，样式可能变化</small>
            </span>
          </label>
          <label class="radio-option">
            <input type="radio" name="exportFormat" value="image">
            <span class="radio-custom"></span>
            <span class="radio-label">
              <strong>图片 PDF</strong>
              <small>文字不可复制，保留原始样式布局</small>
            </span>
          </label>
        </div>
      </section>

      <section class="options-section">
        <label class="section-label">页面样式</label>
        <div class="style-controls">
          <div class="control-group">
            <label for="fontSize">字体大小</label>
            <div class="input-wrapper">
              <input type="number" id="fontSize" min="12" max="24" step="1" value="16">
              <span class="unit">px</span>
            </div>
          </div>
          <div class="control-group">
            <label for="margin">页边距</label>
            <select id="margin">
              <option value="5">窄 (5mm)</option>
              <option value="15" selected>标准 (15mm)</option>
              <option value="25">宽 (25mm)</option>
            </select>
          </div>
        </div>
      </section>

      <section class="options-section">
        <label class="section-label">图像质量 (仅限图片 PDF)</label>
        <div class="control-group">
          <div class="slider-container">
            <input type="range" id="imageQuality" min="0.1" max="1.0" step="0.1" value="0.9">
            <span id="qualityValue">0.9</span>
          </div>
        </div>
      </section>

      <section class="options-section">
        <label class="section-label">选项</label>
        <label class="checkbox-option">
          <input type="checkbox" id="includeImages" checked>
          <span class="checkbox-custom"></span>
          <span>包含图片</span>
        </label>
        <label class="checkbox-option">
          <input type="checkbox" id="forceLightMode" checked>
          <span class="checkbox-custom"></span>
          <span>强制浅色模式</span>
        </label>
      </section>
    </main>

    <footer>
      <button id="exportBtn" class="export-btn">
        <span class="btn-icon">📄</span>
        <span class="btn-text">导出 PDF</span>
      </button>
      <div id="progress" class="progress hidden">
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
        <span class="progress-text">正在生成 PDF...</span>
      </div>
      <div id="statusToast" class="status-toast hidden"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
